# Render blueprint — FastAPI + ML API only (the frontend is hosted on Vercel).
#
# Deploy order:
#   1. Apply this blueprint (New -> Blueprint) to create the API service.
#   2. Copy the service URL into the Vercel project as API_INTERNAL_URL.
#   3. Redeploy the Vercel project.
#
# The free plan has 512 MB RAM, which fits the API on its own but NOT the API and
# the Next.js server together (use the root Dockerfile on a 2 GB host for that).
services:
  - type: web
    name: diabetes-prediction-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./api/python/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Set to "production" once Clerk + Neon are configured.
      - key: ENVIRONMENT
        value: development
      # Only honoured when ENVIRONMENT != production. Remove both once Clerk is wired up.
      - key: DEV_AUTH_BYPASS
        value: "true"
      - key: DEV_USER_ID
        value: demo-user
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
